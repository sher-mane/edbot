# Local LLM server (OpenAI-compatible API)
base_url="http://127.0.0.1:8080/v1"
model="ggml-org/gemma-3-4b-it-qat-GGUF:Q4_0"
max_tokens=1024
temperature=0.7
# api_key is optional — only set it if your local server requires one
# api_key=""

# --- Freechat settings ----------------------------------------------------------
# Personality used when Ed chats casually in an enabled channel.
freechat_personality="millennial culture, dark humor, occasionally sarcastic, funny, sometimes mysterious or weird"
# How many of the most recent messages are sent to the model as context.
freechat_history_limit=10
# Chance (0.0-1.0) that Ed replies to casual messages that aren't questions.
freechat_random_chance=0.3
# Minimum seconds between freechat replies in the same channel.
freechat_cooldown_seconds=10
